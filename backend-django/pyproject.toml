[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inventory-backend-django"
version = "0.1.0"
description = "Django backend for the Inventory Management Platform"
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
dev = [
    "ruff==0.16.8",
    "pytest==9.1.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]